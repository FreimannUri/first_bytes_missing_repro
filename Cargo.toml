[package]
name = "first_bytes_missing_repro"
version = "0.1.0"
authors = ["freimann-uri <freimann.uri@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
critical-section =          { version = "=1.2.0" }
embassy-executor =          { version = "=0.10.0" }
embassy-time =              { version = "=0.5.1" }
esp-backtrace =             { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf =    { version = "=0.6.0", features = ["esp32s3"] }
esp-hal =                   { version = "=1.2.0", features = ["unstable", "log-04"] }
esp-println =               { version = "=0.18.0", features = ["esp32s3", "log-04"] }
esp-rtos =                  { version = "=0.4.0", features = ["esp32s3", "embassy"] }
log =                       { version = "=0.4.34" }

[patch.crates-io]
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 's'
overflow-checks = false
